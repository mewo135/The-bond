<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage 02 - Birth Garden</title>
    <link rel="stylesheet" href="stage02.css">
    <link rel="stylesheet" href="https://use.typekit.net/exh4qsk.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/p5.min.js"></script>
</head>
<body>
    <a href="index.html" id="homeNav">
        <img id="titleNav" src="assets/title.svg" alt="The Bond - back to home">
    </a>

    <div class="theme-toggle-container">
        <input type="checkbox" id="themeToggle" class="toggle-checkbox">
        <label for="themeToggle" class="toggle-label">
            <img class="toggle-icon toggle-icon-light" src="assets/lighticon.svg" alt="light">
            <img class="toggle-icon toggle-icon-dark" src="assets/darkicon.svg" alt="dark">
            <span class="toggle-circle"></span>
        </label>
    </div>

    <div class="panel">
        <div class="section">
            <label>Color</label>
            <div class="swatches" id="colorSwatches"></div>
        </div>

        <div class="section">
            <label>Petal Shape</label>
            <div class="shape-buttons">
                <button class="shape-btn active" data-shape="fat">Fat</button>
                <button class="shape-btn" data-shape="thin">Thin</button>
            </div>
        </div>

        <div class="section">
            <label>Size: <span id="sizeDisplay">1.0</span>x</label>
            <input type="range" id="flowerSize" min="0.5" max="2" step="0.1" value="1">
        </div>

        <div class="section">
            <label>Flowers: <span id="flowerCountDisplay">0</span></label>
        </div>

        <div class="action-buttons">
            <button id="addFlower">+ Add</button>
            <button id="addMultiple">+ Add 5</button>
            <button id="randomGenerate" style="grid-column: span 2;">⟳ Random Generate</button>
        </div>
    </div>

    <script src="stage02.js"></script>
</body>
</html>
