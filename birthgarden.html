<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birth Garden</title>
    <link rel="stylesheet" href="birthgarden.css">
    <link rel="stylesheet" href="https://use.typekit.net/exh4qsk.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/p5.min.js"></script>
</head>
<body>
    <a href="index.html" id="homeNav">
        <img id="titleNav" src="assets/title.svg" alt="The Bond - back to home">
    </a>

    <div class="theme-toggle-container">
        <input type="checkbox" id="themeToggle" class="toggle-checkbox">
        <label for="themeToggle" class="toggle-label">
            <img class="toggle-icon toggle-icon-light" src="assets/lighticon.svg" alt="light">
            <img class="toggle-icon toggle-icon-dark" src="assets/darkicon.svg" alt="dark">
            <span class="toggle-circle"></span>
        </label>
    </div>

    <div class="panel">
        <div class="section">
            <label>Flower type:</label>
            <div class="type-buttons" id="flowerTypeButtons">
                <button class="type-btn active" data-flower-type="daisy">Daisy</button>
                <button class="type-btn" data-flower-type="hydrangea">Hydrangea</button>
                <button class="type-btn" data-flower-type="tulip">Tulip</button>
            </div>
        </div>

        <div class="section">
            <label>Color:</label>
            <div class="swatches" id="colorSwatches"></div>
        </div>

        <div class="section">
            <label>Size: <span id="sizeDisplay">1.0</span>x</label>
            <input type="range" id="flowerSize" min="0.1" max="2" step="0.1" value="1">
        </div>

        <div class="section">
            <label>Random generated:</label>
            <button id="randomToggle" class="random-btn" type="button">OFF</button>
        </div>

        <div class="section">
            <label>Flower: <span id="flowerCountDisplay">0</span></label>
        </div>

        <p class="hint-text">Click anywhere to plant a flower</p>
    </div>

    <script src="birthgarden.js"></script>
    <script src="audio.js" data-src="audio/audio2.mp3"></script>
</body>
</html>
